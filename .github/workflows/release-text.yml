name: Release text

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Exclusive base revision
        default: HEAD^
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the complete SDK history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release text and commit messages
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python3 -B scripts/check-release-text.py --base "$BASE_REVISION"
      - name: Check text validation regressions
        run: python3 -B -m unittest discover -s scripts/tests -p test_release_text.py -v
