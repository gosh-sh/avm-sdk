[descriptor]
execution_mode = "message_isolated"
state_schema_id = "1111111111111111111111111111111111111111111111111111111111111100"

[abi]
state_root_type_id = 1

# `len = 100` is the HEADER only (0 rows); real state is
# `100 + 113 * row_count` bytes once any row exists, so this ABI type only
# ever matches the convenience decode on a freshly-deployed (0-row) pool.
# Every other call's own `raw_state` must be read by its own documented
# byte layout (docs/SPEC.md's "State layout"), not this ABI type. Tested
# directly: `kind = "bytes"` (no fixed len) fails to round-trip both the
# 0-row and 1-row cases differently from this fixed-length declaration,
# and a fixed `len` set to the maximum possible size (`MAX_ROWS` rows)
# fails the 0-row case. No ABI kind in this schema supports genuinely
# variable-length state.
[[abi.types]]
id = 1
kind = "fixed_bytes"
name = "state"
len = 100

[[abi.types]]
id = 2
kind = "fixed_bytes"
name = "init_data"
len = 40

[[abi.types]]
id = 3
kind = "fixed_bytes"
name = "stake_body"
len = 24

[[abi.types]]
id = 4
kind = "fixed_bytes"
name = "unstake_body"
len = 88

[[abi.types]]
id = 5
kind = "fixed_bytes"
name = "claim_body"
len = 72

[[abi.types]]
id = 6
kind = "fixed_bytes"
name = "fund_rewards_body"
len = 16

[[abi.methods]]
name = "staking.rewards.deploy"
input_type_id = 2

[[abi.methods]]
name = "staking.rewards.stake"
input_type_id = 3

[[abi.methods]]
name = "staking.rewards.unstake"
input_type_id = 4

[[abi.methods]]
name = "staking.rewards.claim"
input_type_id = 5

[[abi.methods]]
name = "staking.rewards.fund_rewards"
input_type_id = 6

# No "staking.rewards.callback" entry: callbacks are dispatched via the
# INTERNAL_FLAG_CALLBACK wire flag, checked before any named-method lookup.
# This contract's own callback `method_id` is a dynamic per-request
# `pending_id` correlation value, not a fixed hash-derived selector.

