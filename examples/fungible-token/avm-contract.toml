[descriptor]
execution_mode = "message_isolated"
state_schema_id = "f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1"

[abi]
