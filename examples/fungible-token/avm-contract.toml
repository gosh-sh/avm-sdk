[[abi.events]]
name = "token.transferred"

[[abi.events.fields]]
id = 1
type_id = 3
name = "amount"

[[abi.events.fields]]
id = 2
type_id = 4
name = "from"

[[abi.events.fields]]
id = 3
type_id = 4
